<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5b6b5f"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#eef0ec"/>
  <text x="32" y="44" font-size="13" font-weight="700" fill="#2f7d32" letter-spacing="1">METADATA FILTERING · find_region_rule</text>
  <text x="32" y="72" font-size="20" font-weight="700" fill="#1f2a22">찾기 전에 먼저 좁히고, 좁힌 안에서 고른다</text>

  <!-- stage 1: all records -->
  <rect x="32" y="110" width="200" height="270" rx="16" fill="#fff" stroke="#d5dbd3"/>
  <text x="132" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a22">지역 예외 전체</text>
  <text x="132" y="160" text-anchor="middle" font-size="12" fill="#5b6b5f">경기도 23개 시군 · 53개</text>
  <g font-size="12" fill="#5b6b5f">
    <rect x="52" y="180" width="160" height="30" rx="8" fill="#f3f5f2"/><text x="132" y="200" text-anchor="middle">화성시 · 종이류</text>
    <rect x="52" y="218" width="160" height="30" rx="8" fill="#dff3d4"/><text x="132" y="238" text-anchor="middle" fill="#1f5a22" font-weight="700">수원시 · 종이류</text>
    <rect x="52" y="256" width="160" height="30" rx="8" fill="#f3f5f2"/><text x="132" y="276" text-anchor="middle">군포시 · 종이류</text>
    <rect x="52" y="294" width="160" height="30" rx="8" fill="#dff3d4"/><text x="132" y="314" text-anchor="middle" fill="#1f5a22" font-weight="700">수원시 · 종이류</text>
    <rect x="52" y="332" width="160" height="30" rx="8" fill="#f3f5f2"/><text x="132" y="352" text-anchor="middle">수원시 · 페트병</text>
  </g>

  <!-- filter -->
  <rect x="258" y="170" width="244" height="150" rx="16" fill="#1f5a22"/>
  <text x="380" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#b6f09a" letter-spacing="1">① 메타데이터 필터</text>
  <g font-size="12.5" fill="#fff" font-family="ui-monospace, Menlo, monospace">
    <text x="276" y="232">doc_type = region_exception</text>
    <text x="276" y="258">region = 수원시</text>
    <text x="276" y="284">major = 종이류</text>
  </g>
  <text x="380" y="308" text-anchor="middle" font-size="11" fill="#b6f09a">사용자가 설정한 지역</text>

  <!-- similarity -->
  <rect x="526" y="170" width="170" height="150" rx="16" fill="#fff" stroke="#d5dbd3"/>
  <text x="611" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#2f7d32" letter-spacing="1">② 유사도 검색</text>
  <text x="611" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2a22">필터 범위 안에서만</text>
  <text x="611" y="262" text-anchor="middle" font-size="13" fill="#5b6b5f">query = 소분류</text>
  <text x="611" y="286" text-anchor="middle" font-size="13" fill="#5b6b5f">k = 10</text>

  <!-- priority -->
  <rect x="722" y="110" width="206" height="270" rx="16" fill="#dff3d4" stroke="#b6dca3"/>
  <text x="825" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#2f7d32" letter-spacing="1">③ 우선순위로 선택</text>
  <g font-size="13" fill="#1f2a22">
    <rect x="740" y="160" width="170" height="60" rx="10" fill="#fff"/>
    <text x="756" y="185" font-weight="700">1  소분류 일치</text>
    <text x="756" y="206" font-size="12" fill="#5b6b5f">minor == 요청한 소분류</text>
    <rect x="740" y="228" width="170" height="60" rx="10" fill="#fff"/>
    <text x="756" y="253" font-weight="700">2  대분류 전체 예외</text>
    <text x="756" y="274" font-size="12" fill="#5b6b5f">minor_category 키 없음</text>
    <rect x="740" y="296" width="170" height="60" rx="10" fill="#fff"/>
    <text x="756" y="321" font-weight="700">3  가장 가까운 항목</text>
    <text x="756" y="342" font-size="12" fill="#5b6b5f">results[0]</text>
  </g>

  <g stroke="#5b6b5f" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M232 245H256"/>
    <path d="M502 245H524"/>
    <path d="M696 245H720"/>
  </g>
  <text x="380" y="350" text-anchor="middle" font-size="12" fill="#c0392b">화성시 · 군포시 규정은 여기서 제외</text>
</svg>
